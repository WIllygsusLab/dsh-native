name: build-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships an Android SDK. Use it directly rather than
      # android-actions/setup-android, whose default `sdkmanager tools` step fails
      # on current SDK repos ("Failed to find package 'tools'").
      - name: Android SDK pieces (build-tools 34 + platform 34)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          yes | "$BIN/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$BIN/sdkmanager" "build-tools;34.0.0" "platforms;android-34"

      # Release builds use the stable release key (repo secrets); PR builds fall
      # back to a throwaway key generated by build-native.sh.
      - name: Release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPS }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PROPS:-}" ]; then
            mkdir -p signing
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/dsh-mobile.jks
            printf '%s\n' "$KEYSTORE_PROPS" > signing/keystore.properties
            chmod 600 signing/dsh-mobile.jks signing/keystore.properties
            echo "release signing key loaded"
          else
            echo "no release key secrets - throwaway key will be generated"
          fi

      - name: Build (aapt2 -> javac -> d8 -> zipalign -> apksigner)
        run: |
          ./build-native.sh
          shasum -a 256 dist/dsh-native.apk | tee dist/sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-apk
          path: |
            dist/dsh-native.apk
            dist/sha256.txt
